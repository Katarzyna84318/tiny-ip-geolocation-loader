[project]
name = "tiny-ip-geolocation-loader"
version = "0.1.0"
description = "Build a searchable index from IP-to-country CSV data and query addresses by range."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
